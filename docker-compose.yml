# Production stack: app + Postgres + a cron sidecar for the 10-minute refresh.
#
#   cp .env.docker.example .env.docker   # fill in secrets
#   docker compose --env-file .env.docker up -d --build
#
# Uses its own env file so it never picks up your local SQLite .env.

services:
  db:
    image: postgres:17
    restart: unless-stopped
    environment:
      POSTGRES_USER: zeedude
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env.docker}
      POSTGRES_DB: zeedude
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U zeedude -d zeedude"]
      interval: 5s
      timeout: 5s
      retries: 10

  app:
    build:
      context: .
      args:
        NEXT_PUBLIC_SITE_URL: ${NEXT_PUBLIC_SITE_URL:?Set NEXT_PUBLIC_SITE_URL in .env.docker}
        NEXT_PUBLIC_REFERRAL_CODE: ${NEXT_PUBLIC_REFERRAL_CODE:-ZEEDUDE}
        NEXT_PUBLIC_REFERRAL_URL: ${NEXT_PUBLIC_REFERRAL_URL:-https://solpump.io/a/ZEEDUDE}
        NEXT_PUBLIC_DISCORD_URL: ${NEXT_PUBLIC_DISCORD_URL:-}
        NEXT_PUBLIC_X_URL: ${NEXT_PUBLIC_X_URL:-}
        NEXT_PUBLIC_KICK_URL: ${NEXT_PUBLIC_KICK_URL:-}
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    ports:
      - "${APP_PORT:-3000}:3000"
    environment:
      DATABASE_URL: postgresql://zeedude:${POSTGRES_PASSWORD}@db:5432/zeedude
      ADMIN_PASSWORD_HASH: ${ADMIN_PASSWORD_HASH:?Set ADMIN_PASSWORD_HASH (npm run admin:password -- "..." --print)}
      SESSION_SECRET: ${SESSION_SECRET:?Set SESSION_SECRET}
      CRON_SECRET: ${CRON_SECRET:?Set CRON_SECRET}
      DATA_PROVIDER: ${DATA_PROVIDER:-manual}
      # Set to true only when a reverse proxy (Caddy, nginx, Cloudflare) sets X-Forwarded-For.
      TRUST_PROXY_HEADERS: ${TRUST_PROXY_HEADERS:-false}
      NEXT_SERVER_ACTIONS_ENCRYPTION_KEY: ${NEXT_SERVER_ACTIONS_ENCRYPTION_KEY:-}
    volumes:
      - fallback:/var/cache/zeedude

  cron:
    image: curlimages/curl:8.11.1
    restart: unless-stopped
    depends_on:
      - app
    environment:
      CRON_SECRET: ${CRON_SECRET}
    # $$ escapes compose interpolation so the shell reads the variable.
    entrypoint:
      - /bin/sh
      - -c
      - |
        sleep 30
        while true; do
          curl -fsS -H "Authorization: Bearer $$CRON_SECRET" http://app:3000/api/cron/refresh || echo "refresh failed"
          sleep 600
        done

volumes:
  pgdata:
  fallback:
